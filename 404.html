    <!-- =========================================
         GITHUB PAGES SPA REDIRECT
    ========================================== -->

    <!--
      GitHub Pages serves this file when a
      requested path does not exist physically.

      React Router handles application routes,
      but GitHub Pages needs this redirect to
      restore direct links and page refreshes.

      This script works together with the
      redirect restoration script in index.html.

      Repository:
      /abdulrahman-portfolio-react/

      Important:
      Keep pathSegmentsToKeep = 1 while the
      application is hosted in this repository.
    -->

    <script>
      (function () {
        "use strict";

        /* -------------------------
           CONFIGURATION
        ------------------------- */

        var pathSegmentsToKeep = 1;

        var location = window.location;

        /* -------------------------
           BASE URL
        ------------------------- */

        var pathSegments =
          location.pathname.split("/");

        var basePath = pathSegments
          .slice(0, 1 + pathSegmentsToKeep)
          .join("/");

        /* -------------------------
           REQUESTED ROUTE
        ------------------------- */

        var route = pathSegments
          .slice(pathSegmentsToKeep + 1)
          .join("/");

        /*
          If there is no route to restore,
          return to the application root.
        */

        if (!route) {
          window.location.replace(
            location.protocol +
              "//" +
              location.host +
              basePath +
              "/"
          );

          return;
        }

        /* -------------------------
           PRESERVE QUERY PARAMETERS
        ------------------------- */

        var query = location.search
          ? "&" +
            location.search
              .slice(1)
              .replace(/&/g, "~and~")
          : "";

        /* -------------------------
           PRESERVE URL HASH
        ------------------------- */

        var hash = location.hash || "";

        /* -------------------------
           BUILD REDIRECT URL
        ------------------------- */

        var redirectUrl =
          location.protocol +
          "//" +
          location.host +
          basePath +
          "/?/" +
          route.replace(/&/g, "~and~") +
          query +
          hash;

        /* -------------------------
           REDIRECT
        ------------------------- */

        window.location.replace(redirectUrl);
      })();
    </script>
