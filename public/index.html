    <!-- =========================================
         GITHUB PAGES SPA REDIRECT FIX
    ========================================== -->

    <!--
      This script works together with 404.html.

      It restores the requested route when
      GitHub Pages redirects a direct page visit
      to the application's main index.html.

      Do not remove this script while using
      BrowserRouter with GitHub Pages.
    -->

    <script>
      (function (location) {
        if (
          !location.search ||
          location.search.charAt(1) !== "/"
        ) {
          return;
        }

        var decoded = location.search
          .slice(1)
          .split("&")
          .map(function (segment) {
            return segment.replace(/~and~/g, "&");
          })
          .join("?");

        window.history.replaceState(
          null,
          "",
          location.pathname.slice(0, -1) +
            decoded +
            location.hash
        );
      })(window.location);
    </script>

    <!-- =========================================
         INITIAL THEME
    ========================================== -->

    <!--
      Apply the saved theme before React mounts
      to reduce the initial light/dark flash.

      ThemeContext.js remains responsible for
      managing subsequent theme changes.
    -->

    <script>
      (function () {
        var theme = "light";

        try {
          var savedTheme =
            window.localStorage.getItem("theme");

          if (
            savedTheme === "light" ||
            savedTheme === "dark"
          ) {
            theme = savedTheme;
          }
        } catch (error) {
          theme = "light";
        }

        document.documentElement.setAttribute(
          "data-theme",
          theme
        );

        document.documentElement.style.colorScheme =
          theme;
      })();
    </script>

    <!-- =========================================
         INITIAL LANGUAGE
    ========================================== -->

    <!--
      Match the saved language before React mounts.

      i18n.js remains responsible for language
      changes after the application initializes.
    -->

    <script>
      (function () {
        var language = "ar";

        try {
          var savedLanguage =
            window.localStorage.getItem(
              "i18nextLng"
            );

          var normalized = String(
            savedLanguage || ""
          )
            .trim()
            .toLowerCase()
            .replace(/_/g, "-")
            .split("-")[0];

          if (
            normalized === "ar" ||
            normalized === "en"
          ) {
            language = normalized;
          }
        } catch (error) {
          language = "ar";
        }

        document.documentElement.setAttribute(
          "lang",
          language
        );

        document.documentElement.setAttribute(
          "dir",
          language === "ar" ? "rtl" : "ltr"
        );
      })();
    </script>
